services:
  app:
    build:
      context: .
    restart: unless-stopped
    # Echte Werte stehen in .env auf dem Server — nie im Image, nie im Repo.
    env_file: .env
    expose:
      - '3000'

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN fehlt in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        # Erst weiterleiten, wenn der Healthcheck des Containers gruen ist.
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
